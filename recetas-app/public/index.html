<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mi Recetario</title>
  <meta name="theme-color" content="#fbf6ee" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="hoy" type="button">
      <span class="brand-mark" aria-hidden="true">📔</span>
      <span class="brand-name">Mi Recetario</span>
    </button>
    <button id="goal-chip" class="goal-chip" type="button" aria-label="Cambiar objetivo"></button>
  </header>

  <main id="main">
    <section id="view-hoy" class="view"></section>
    <section id="view-recetario" class="view" hidden></section>
    <section id="view-super" class="view" hidden></section>
    <section id="view-diario" class="view" hidden></section>
    <section id="view-perfil" class="view" hidden></section>
  </main>

  <button id="chef-fab" class="chef-fab" type="button" aria-label="Pedir un consejo">
    <span class="chef-face" aria-hidden="true">👩‍🍳</span>
    <span class="chef-fab-label">¿Un consejo?</span>
  </button>

  <nav class="tabs" aria-label="Secciones">
    <button data-view="hoy" type="button"><span aria-hidden="true">🏡</span>Hoy</button>
    <button data-view="recetario" type="button"><span aria-hidden="true">📖</span>Recetario</button>
    <button data-view="super" type="button"><span aria-hidden="true">🧺</span>Súper</button>
    <button data-view="diario" type="button"><span aria-hidden="true">📔</span>Diario</button>
  </nav>

  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="sheet2" class="sheet"></dialog>
  <dialog id="cook" class="cook"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
